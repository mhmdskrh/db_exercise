services:
  postgres:
    image: postgres:18.6
    container_name: equipment-rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rental_db
      POSTGRES_USER: rental_user
      POSTGRES_PASSWORD: rental_password
    ports:
        - "5433:5433"
    volumes:
        - postgres_rental_data:/var/lib/postgresql
    healthcheck:
        test:
          [
          "CMD-SHELL",
          "pg_isready -U rental_user -d rental_db"
          ]
        interval: 5s
        timeout: 5s
        retries: 10
volumes:
    postgres_rental_data: